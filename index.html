<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#1f1613" />
    <!-- iOS 主屏应用：全屏，状态栏悬浮在画面上。这些 meta 在「添加到主屏幕」那一刻固化，改了要删图标重装才生效 -->
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="TunePick" />
    <meta name="description" content="TunePick 是打开就能用的网页吉他调音器：用麦克风听琴声，实时显示音名、频率和音准偏差。声音只在本机处理。" />
    <link rel="icon" href="favicon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="icons/apple-touch-icon.png" />
    <title>TunePick 吉他调音器</title>
    <script type="module" src="/src/main.ts"></script>
  </head>
  <body>
    <p class="toast" id="toast" role="status" hidden></p>

    <main class="app" id="app" data-state="idle">
      <header class="bar">
        <h1 class="brand">TunePick</h1>
        <button class="chip" id="open-settings" type="button" aria-haspopup="dialog">
          A4 = <span id="a4-label">440</span> Hz
        </button>
      </header>

      <section class="readout" aria-label="当前音高">
        <p class="note">
          <span class="note-letter" id="note-letter"></span>
          <span class="note-marks">
            <span class="note-sharp" id="note-sharp" hidden>♯</span>
            <span class="note-octave" id="note-octave"></span>
          </span>
        </p>
        <p class="frequency"><span id="frequency">–</span> Hz</p>
      </section>

      <section class="meter">
        <svg class="gauge" id="gauge" role="img" aria-label="音准仪表盘：指针偏左表示偏低，偏右表示偏高"></svg>
        <p class="cents"><span class="cents-value" id="cents"></span> 音分</p>
        <p class="status" id="status" role="status"></p>
      </section>

      <section class="strings" aria-label="琴弦">
        <div class="strings-head">
          <button class="chip" id="auto" type="button" aria-pressed="true">自动识别</button>
          <p class="strings-hint" id="strings-hint"></p>
        </div>
        <div class="fretboard" id="fretboard"></div>
      </section>

      <footer class="actions">
        <p class="notice" id="notice" role="alert" hidden></p>
        <button class="primary" id="toggle" type="button">开始调音</button>
      </footer>
    </main>

    <dialog class="sheet" id="settings" aria-labelledby="settings-title">
      <h2 class="sheet-title" id="settings-title">设置</h2>

      <div class="field">
        <div class="field-text">
          <p class="field-name">基准音 A4</p>
          <p class="field-help">通常保持 440 Hz。和乐队或伴奏用的基准不同时再改。</p>
        </div>
        <div class="stepper">
          <button type="button" id="a4-down" aria-label="降低 1 Hz">−</button>
          <output id="a4-value">440</output>
          <button type="button" id="a4-up" aria-label="升高 1 Hz">+</button>
        </div>
      </div>
      <button class="text-button" type="button" id="a4-reset">恢复 440 Hz</button>

      <label class="field">
        <span class="field-text">
          <span class="field-name">点琴弦时播放参考音</span>
          <span class="field-help">关闭后，点琴弦只选弦，不出声。</span>
        </span>
        <input class="switch" type="checkbox" role="switch" id="tone-on-tap" />
      </label>

      <div class="field">
        <div class="field-text">
          <p class="field-name" id="version"></p>
          <p class="field-help" id="force-update-result" role="status"></p>
        </div>
        <button class="chip" type="button" id="force-update">更新到最新版</button>
      </div>

      <div class="field">
        <div class="field-text">
          <p class="field-name">诊断文件</p>
          <p class="field-help">读数不准时，拨几下弦再点导出，把文件发给开发者排查。</p>
          <p class="field-help" id="export-diagnostics-result" role="status"></p>
        </div>
        <button class="chip" type="button" id="export-diagnostics">导出</button>
      </div>

      <p class="sheet-note">
        琴声只在这台设备上分析，不会上传。诊断文件里有最近的检测记录和一小段琴声，只在你点「导出」时生成，交给你自己保管。
      </p>

      <form method="dialog" class="sheet-actions">
        <button class="primary is-compact" type="submit">完成</button>
      </form>
    </dialog>

    <dialog class="sheet" id="update" aria-labelledby="update-title">
      <h2 class="sheet-title" id="update-title">发现新版本</h2>
      <p class="update-subtitle" id="update-subtitle"></p>
      <div class="update-notes" id="update-notes"></div>
      <p class="sheet-note">更新会刷新一次页面，设置不受影响。</p>
      <p class="update-progress" id="update-progress" role="status" hidden></p>
      <p class="notice" id="update-fail" role="alert" hidden></p>
      <div class="sheet-actions">
        <button class="text-button" type="button" id="update-later">稍后</button>
        <button class="primary is-compact" type="button" id="update-now">立即更新</button>
      </div>
    </dialog>
  </body>
</html>
